[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sn2-mcp"
version = "0.9.0"
description = "Native Unreal interface research and runtime Content/Blueprint mod development for Subnautica 2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.scripts]
sn2-mcp = "sn2_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sn2_mcp"]
