[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sn2-mcp"
version = "0.3.0"
description = "Game interface research and mod development with the Subnautica 2 native MCP bridge"
readme = {text = """
# Subnautica 2 MCP

Python MCP frontend for game-interface research and mod development/prototyping
through the Subnautica 2 native runtime bridge. Tools provide exact editing,
source/interface evidence, CMake/MSVC builds and diagnostics, verified compiled
packages and native mod initialization, disable and restart iteration.
Configure the workspace, native runtime artifacts and game separately.

    sn2-mcp --transport streamable-http --host 127.0.0.1 --port 27224 --workspace-root <workspace> --runtime-root <runtime> --game-root <game>

Connect to http://127.0.0.1:27224/mcp and inspect sn2_status and
sn2_capabilities. Transport availability is separate from target ABI and
executor readiness. Explicit stdio transport is also supported.

Loading a DLL and reflected invocation affect the selected process.
Investigate uncertain outcomes before submitting another explicit action.
""", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.scripts]
sn2-mcp = "sn2_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sn2_mcp"]
