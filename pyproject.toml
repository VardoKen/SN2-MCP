[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sn2-mcp"
version = "0.7.0"
description = "Native Unreal interface research and runtime Content/Blueprint mod development for Subnautica 2"
readme = {text = """
# Subnautica 2 MCP

Python MCP frontend for game-interface research and mod development/prototyping
through the Subnautica 2 native runtime bridge. Tools provide exact editing,
source/interface evidence, native bridge builds, runtime compilation of synchronous
Blueprint function graphs, genuine package/container output, installation receipts
and Blueprint lifecycle. The runtime authoring path uses the supplied bridge and
game companion without an external Editor/cooker or bridge source checkout.
Broader editable asset authoring and cooking use the separately configured
compatible Unreal authoring environment. See the central authoring contract for
supported graph/property shapes and explicit unsupported diagnostics.
Configure the workspace, native runtime artifacts and game separately.

    sn2-mcp --transport streamable-http --host 127.0.0.1 --port 27224 --workspace-root <workspace> --runtime-root <runtime> --game-root <game>

Connect to http://127.0.0.1:27224/mcp and inspect sn2_status and
sn2_capabilities. Transport availability is separate from target ABI and
executor readiness. Explicit stdio transport is also supported.

Loading a DLL and reflected invocation affect the selected process.
Investigate uncertain outcomes before submitting another explicit action.
""", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.scripts]
sn2-mcp = "sn2_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sn2_mcp"]
